# Culori sidebar: separate pentru light / dark ca tema din meniu să rămână coerentă
# (fără CSS cu !important care suprascria fundalul în mod întunecat).

[theme.light.sidebar]
backgroundColor = "#e6ecf7"
secondaryBackgroundColor = "#dce5f5"

[theme.dark.sidebar]
backgroundColor = "#141a22"
secondaryBackgroundColor = "#1c2430"
